<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable app icon for Bliss Tiles and Puzzles — source for
       tiles-maskable-512.png. Same glyph as tiles/favicon.svg, but the
       plate is FULL-BLEED with no rounded corners (the platform crops a
       maskable icon to whatever shape it wants), and the glyph is scaled
       to 80% about the centre so it sits inside the safe zone.
       Public domain (CC0), as with the rest of this project. -->
  <rect width="512" height="512" fill="#000000"/>
  <g transform="translate(256,256) scale(0.8) translate(-256,-256)">
  <g fill="none" stroke="#ffffff" stroke-width="18"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <ellipse cx="256" cy="268" rx="158" ry="168"/>
    <!-- ears -->
    <path d="M104 244 C 48 236, 42 286, 76 302 C 110 312, 130 300, 122 272"/>
    <path d="M408 244 C 464 236, 470 286, 436 302 C 402 312, 382 300, 390 272"/>
    <!-- eyes -->
    <circle cx="200" cy="236" r="33"/>
    <circle cx="312" cy="236" r="33"/>
    <!-- nose -->
    <path d="M256 250 L194 344 L259 344"/>
    <!-- mouth -->
    <circle cx="256" cy="398" r="33"/>
  </g>
  <g fill="#ffffff">
    <circle cx="200" cy="236" r="8"/>
    <circle cx="312" cy="236" r="8"/>
  </g>
  </g>
</svg>
