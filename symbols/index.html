<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bliss Tactile Symbol Designer</title>
<link rel="icon" href="../icons/symbols.svg" type="image/svg+xml">
<!-- Installability (PWA): the manifest + a 192/512 PNG icon pair are what make
     Chrome/Edge offer "Install" in the address bar; the service worker alone is
     not enough. theme-color tints the installed window's title bar. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../icons/symbols-192.png">

<!-- Deps live at the repo root and are shared by both apps; the shell reaches
     them with ../ . three is a bare specifier resolved by this import map; the
     shared engine (../shared/bts-core.js) imports openscad-wasm by relative path. -->
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/build/three.module.min.js",
    "three/addons/": "../vendor/three/examples/jsm/"
  }
}
</script>

<link rel="stylesheet" href="../shared/bts.css">
</head>
<body>
<!-- Per-app configuration for the shared engine. Everything that differs between
     the Symbols and Tiles apps is set here and read by ../shared/bts-core.js.
       • appName          — startup log banner (the <title> above is separate).
       • scadBaseName      — WHICH designer .scad this app owns (found by name in the
                             connected folder; the presets .json is <scadBaseName>.json).
       • svgOwnDir         — this app's OWN SVG folder: where the Graphic File picker and
                             preset graphic_svg references resolve (own folder only), and
                             where Create-Graphic saves composites.
       • svgCreateSources  — folders Create-Graphic's "+ Add symbol" may source from (an
                             A/B selector appears only when both are present; own first).
       • svgSplitSourceDirs/svgSplitDestDirs — Split-Graphic's read and write folders.
                             Absent in an app that shouldn't offer it (the button hides).
       • exportFallback    — export base name when no preset/graphic names the output.
       • appRelease/appRepo/appDir — this app's self-update axis. appDir is this app's
                             subfolder in the repo (its sw.js + latest_app_version.json).
       • scadRepo/scadManifestFile — the designer .scad update axis. Both apps' .scad
                             files live in scadRepo, each with its own manifest file. -->
<script>
  window.APP_CONFIG = {
    appName:          'Bliss Tactile Symbol Designer',
    folderName:       'Bliss Tactile Symbols',   // the shared connected folder (both apps use it)
    scadBaseName:     'Bliss Tactile Symbols',
    svgOwnDir:        'Bliss SVG files',
    svgCreateSources: ['Bliss SVG files', 'Basic SVG files'],
    // Split-Graphic reads whole symbols from this app's own folder. Components
    // can be saved back there — the only folder this app's Graphic File picker
    // reads, so that is the default and comes first — or into either Tiles
    // folder, for building a tile or puzzle set out of a symbol's parts without
    // switching apps. A destination that doesn't exist yet is created on save.
    svgSplitSourceDirs: ['Bliss SVG files'],
    svgSplitDestDirs: ['Bliss SVG files', 'Basic SVG files', 'Puzzle SVG files'],
    exportFallback:   'bliss-symbol',
    appRelease:       27,
    appRepo:          'Volksswitch/bts-web-app',
    appDir:           'symbols',
    scadRepo:         'Volksswitch/bliss-tactile-symbols',
    scadManifestFile: 'latest_scad_version.json',
    designerLabel:    'symbol designer',   // mid-sentence label for the .scad update modal + logs
  };
  // "What's new" notes, bundled per-app. Generated from symbols/CHANGELOG.md by
  // scripts/apply-release-notes.mjs — do not hand-edit between the markers.
  // @@RELEASE_NOTES_START@@
  window.APP_CONFIG.releaseNotes = {
  "1": [
    "First release of the Bliss Tactile Symbol Designer web app. Turn a prepped Blissymbol SVG into a finished, 3D-printable tactile symbol STL entirely in Chrome or Edge — no OpenSCAD install and no command line."
  ],
  "2": [
    "The app keeps your symbol designer file up to date. When you open your folder, if a newer version of the symbol designer program has been published, the app offers to download it and replace your local copy — keeping your saved concepts. You can update now, be reminded in a week, or skip. The notice lists what changed so you can decide."
  ],
  "3": [
    "You can now install the designer as an app. In Chrome or Edge an install button appears at the right-hand end of the address bar; installing gives it its own window and a desktop/Start-menu icon, with no browser tabs or address bar. It is the same app either way — your folder, concepts and files are unchanged."
  ],
  "4": [
    "A button bar under the 3D view. The view buttons have moved out of the corner of the 3D view into a bar along the bottom, and are half again as large. Next to them are buttons to export the STL and to save a picture of the 3D view as a PNG file, both saved into your folder. The Export STL button stays lit while the export runs and chimes when it finishes.",
    "A Settings panel. The gear button at the right-hand end of the button bar opens Settings, which starts with an About tab showing the app release, the version of the symbol designer program in your folder, the license, and where the tool comes from. More settings will be added here over time.",
    "The grey title bar at the top of the page is gone, giving the 3D view more room. The app release number it used to show now lives in Settings → About."
  ],
  "5": [
    "Two-colour printing. A second, multi-coloured STL button in the button bar saves the symbol as two files — \"<name> - body.stl\" and \"<name> - graphic.stl\" — so the raised graphic can be printed in a different colour from the body. In your slicer, load the body file first, then right-click it and choose Add Part → Load… and pick the graphic file — it drops into place at the right height automatically, and you can then give each part its own filament (or use a filament change part-way through the print). Load the body first: opening both files together puts the graphic in the wrong place. The original single-file STL button is unchanged."
  ],
  "6": [
    "Build your own graphics from existing ones. A new Create button (next to Settings, below the viewport) opens a dialog where you can string existing Bliss graphics together left to right — for example \"1\" then \"0\" to make \"10\" — and optionally place a plural mark (×) over any one of them. The result is drawn in 2D as you build it, with the Bliss guidelines shown for reference; give it a name and save it, and it drops into your SVG files folder so you can pick it in Graphic File just like the graphics that came with the app.",
    "Concepts no longer inherit settings from each other. Choosing a concept now sets every setting, not just the ones that concept saved: anything it doesn't mention goes back to the symbol designer file's default instead of keeping the value left behind by the concept you had open before. A concept now looks the same however you arrive at it. (Most of the supplied concepts don't save every setting, so this is noticeable — switching between them no longer carries over things like the velcro mounts, the earth and sky lines, or where the braille sits.)",
    "A known starting point in the Concepts list. The list now opens with \"design default values\", the same entry the desktop Customizer offers. Choosing it sets every setting back to the symbol designer file's own defaults and clears the graphic, so you can start a new concept from a known place instead of from whatever the last concept left behind. It is built in rather than saved in your concepts file, so it is always there and cannot be renamed, deleted, or saved over — pressing Save after choosing it asks for a name for a new concept."
  ],
  "7": [
    "The graphic picker always shows what is in your folder right now. Pressing Open or Change re-reads the SVG files folder each time, so a graphic added since you started the app — by the Create dialog or by you, outside the browser — is in the list straight away, with no reload.",
    "Exporting tells you where the file went. The message under the 3D view now names the folder — \"Exported afraid.stl to the Bliss Tactile Symbols folder\" — instead of just saying \"the folder\". The picture (PNG) export says the same.",
    "Deleting a concept leaves you on the starting point. The Concepts box used to go blank while the settings on screen still belonged to the concept you had just deleted. It now loads \"design default values\", so what you see is a real, complete set of settings you can build the next concept from."
  ],
  "8": [
    "Saving a concept now tells you when it didn't work. Save writes your concepts file and then reads it back to confirm the change actually arrived; if it didn't, you get a message saying so. Until now a failed save left the concept looking saved for the rest of the session — it kept its graphic, and switched, rendered and exported normally — and the change was only missing the next time you started the app. The concept is now left marked as unsaved so you can try again, and the same check covers creating, renaming and deleting a concept. The app also re-checks a moment after saving and warns you if something outside it — OneDrive syncing your folder, or a second copy of the app open on the same folder — overwrote what you just saved."
  ],
  "9": [
    "You find out about a lost save while you are still working, not at the end. Every save now re-reads your concepts file — before writing, to be sure the file is still the one it last wrote, and again just after — and it re-checks once more a few seconds later and whenever you switch concepts. If anything has rewritten the file behind the app's back (OneDrive syncing your folder, or a second copy of the app open on the same folder), you get a message there and then and the concept goes back to being marked unsaved, so pressing Save again is all it takes. There is nothing new to click and nothing to remember to run.",
    "A save can no longer wipe out work done in another window. If your concepts file has changed since the app last wrote it, Save stops and tells you instead of overwriting it with what this window happens to be holding."
  ],
  "10": [
    "The app only ever touches \"Bliss Tactile Symbols.json\". You can now keep extra copies of your concepts file in the same folder — \"Bliss Tactile Symbols - Copy.json\", a dated backup, anything — and the app will leave them completely alone. It reads and saves concepts only in the file whose name matches your symbol designer file. Before, the app used whichever .json the folder happened to list first, so a backup copy could quietly become the file your saves went to while the real one never changed — and you would only find out the next time you opened the app. The startup log now names the concepts file it is using and lists any other .json files it is ignoring."
  ],
  "12": [
    "\"Create a graphic\" can now put a past or future indicator over a component, not just a plural one. Each component in the dialog has three tick boxes — ×, past and future — and a component carries one indicator at a time, so ticking one clears the others. The past and future marks are the standard Blissymbolics characters: a shallow bow in the indicator row, curving to the right for past and to the left for future."
  ],
  "13": [
    "\"Remove Bliss Indicators\" no longer removes an indicator you added yourself. It now takes off only the indicator that came built into the BCI graphic, and leaves anything you ticked on in \"Create a graphic\" in place. Before, both were removed together — so if the graphic already carried an indicator, adding your own put two marks in the same spot and then lost them both."
  ],
  "14": [
    "\"Create a graphic\" now deals with the indicators your components were drawn with, so your own indicator no longer lands on top of one. Tick ×, past or future on a component and it replaces that component's built-in indicator rather than sitting on it. There is also a new \"Remove Bliss indicators the components came with\" tick box in the dialog, on by default, which takes them off the other components too. The preview shows exactly what gets saved. Your original symbol files are untouched — the new graphic is saved under its own name."
  ],
  "15": [
    "When a render fails, the on-screen message now shows what actually went wrong, instead of pointing you to a browser console the app doesn't display.",
    "Fixed: a number you type into a field and then Save right away is now kept in the saved concept. Before, if the typed value hadn't been confirmed yet (with Enter or Tab) it could be left out of the save.",
    "Fixed: the \"What's new\" notice could list the wrong releases. This app and Bliss Tiles and Puzzles shared a single record of which release you last saw, so opening one could make the other's notice show releases you had already read, or skip the notice altogether. Each app now keeps its own record. The same applied to the \"Remind me in a week\" postponement on a designer file update — postponing one app's no longer silences the other's."
  ],
  "16": [
    "Fixed: a release could go by without its \"What's new\" notice. The app now marks a release as read only when it actually had something to show, so an interim build with no notes can't quietly swallow the next real one."
  ],
  "17": [
    "\"Create a graphic\" can now stack components as well as place them side by side. Tick \"over\" on a component and it is superimposed on the one to its left instead of sitting next to it — centered on it, and keeping its own height on the Bliss guidelines. Useful for the compounds where one symbol goes inside or over another."
  ],
  "18": [
    "New \"Reset\" in the Concepts list — throw away unsaved changes. As soon as you change anything, \"● unsaved\" appears and a \"↺ Reset — discard unsaved changes\" line appears at the top of the Concepts list. Choosing it puts every setting, including the graphic, back the way it was when you last opened or saved the concept, and the list goes back to normal. With no concept chosen it goes back to the designer file's own defaults.",
    "New \"Split a graphic into components\" button, next to \"Create a graphic\". Pick one symbol and it shows you the parts it is drawn from — the whole symbol, each line, circle and dot, and the quarter-arcs a circle is made of — each with a picture and a file name you can edit. Tick the ones you want and choose where they go: your own Bliss SVG files folder, where they are ready to pick in Graphic File like any other graphic, or the Basic SVG files or Puzzle SVG files folder, to build a tile or puzzle set out of a symbol's parts without leaving this app. Every part keeps the size and place it had on the whole symbol, so a set of parts fits back together."
  ],
  "19": [
    "Reset is now a button, next to Save under the Concepts box. It arrived in the last release as a line inside the Concepts list that only appeared once you had changed something, which made it hard to find. It now sits beside Save and is always in view, greyed until there is something to discard — Save keeps your changes, Reset throws them away."
  ],
  "21": [
    "\"Diameter Of Hole\" and \"Move Hole Vertically\" can now be set to a tenth of a millimeter instead of a whole one. (Needs version 4 or later of the symbol designer file.)",
    "Fixed: the \"What's new\" notice could go missing on the very update it was meant to describe, leaving you with nothing but the start page appearing twice. The app was putting the notice up on the old build, a moment before the update reloaded the page — so the notice was swept away, and it counted as read. It now waits until the app has finished checking for an update, and appears on the new build."
  ],
  "22": [
    "Updates are now more reliable. The app used to look up its version information on GitHub — a site some school and workplace networks block outright, and one that could briefly disagree with the app itself just after a release. It now reads that information from its own web address, so it always matches the app you are actually running, and it keeps working on networks that block GitHub."
  ],
  "23": [
    "New app icon: a white symbol on a black background, matching the Volksswitch website. Black and white stay visible whatever colors you have chosen for your desktop. The window's title bar now matches the icon. Each app keeps its own picture, so they are still easy to tell apart from one another."
  ],
  "24": [
    "New Preferences tab in Settings, with two things in it. You can turn off the “What’s new” notice that appears after the app updates itself. And you can now save a copy of your settings to a file, and load a saved copy back.",
    "Why saving a copy is worth doing: your settings are kept by your browser against this app’s web address. They are not in your folder with your concepts and graphics, so they do not travel when you move to another computer, and they are lost if the browser is ever cleared. A saved copy covers both. It also covers both apps at once — a copy saved from either one restores the settings for both."
  ],
  "25": [
    "If the app ever seems stuck on an old version, Settings → Preferences now has “Reload the app cleanly”. Use that rather than a hard refresh — a hard refresh skips past the app entirely and can lose your settings. The old advice to press Ctrl-Shift-R has been removed.",
    "Groundwork for the app's move to a new web address. This release cannot move anyone — it only teaches the app how, and it stays switched off until the new address is ready. When it does happen you will be asked to open your folder once more, because permission to read a folder cannot follow the app to a new address. Your concepts and graphics are in that folder and are not affected. Your settings come across with you."
  ],
  "26": [
    "If the app ever opens with no settings at all — on a new computer, or after your browser has been cleared — it now offers to load a saved settings file right there on the opening screen, instead of quietly starting from scratch."
  ],
  "27": [
    "Fixed, important: saving a copy of your settings, and the move to the new web address, could pick up information belonging to OTHER Volksswitch apps that share the same web address — including private details and an access key. Both now handle only this app's own settings and nothing else. If you saved a settings file before today, delete it and save a fresh one."
  ]
};
  // @@RELEASE_NOTES_END@@
</script>
<!-- Boot: pull the shared body markup, inject it as body's first children (so
     <main> stays a direct flex child, which the CSS requires), then load the
     engine (its top-level DOM wiring runs after the markup exists). -->
<script type="module">
  try {
    const resp = await fetch('../shared/app-body.html');
    if (!resp.ok) throw new Error('shared/app-body.html → ' + resp.status);
    document.body.insertAdjacentHTML('afterbegin', await resp.text());
    await import('../shared/bts-core.js');
  } catch (e) {
    document.body.insertAdjacentHTML('afterbegin',
      '<pre style="padding:16px;color:#c0392b;white-space:pre-wrap">Failed to start the app: '
      + (e && e.message ? e.message : e) + '</pre>');
    throw e;
  }
</script>
</body>
</html>
